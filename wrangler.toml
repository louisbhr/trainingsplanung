# Deploy mit:  npx wrangler deploy
# Geheimes nur als Secret setzen (einmalig, bleibt bei jedem Deploy erhalten):
#   npx wrangler secret put STRAVA_CLIENT_SECRET
#   npx wrangler secret put ANTHROPIC_API_KEY    # eigener Workspace, Limit ~5 USD (E2, M2)
# Öffentliche Werte (Client-ID, erlaubte Herkunft) stehen unten unter [vars].
name = "trainingsplanung-auth"
main = "worker.js"
compatibility_date = "2024-11-01"

# Öffentliche Werte als [vars] im Repo: `wrangler deploy` löscht sonst
# Variablen, die nur im Cloudflare-Dashboard gesetzt sind. Geheimes
# (STRAVA_CLIENT_SECRET, ANTHROPIC_API_KEY) bleibt `wrangler secret put`.
preview_urls = false

[vars]
STRAVA_CLIENT_ID = "277715"
ALLOWED_ORIGINS = "https://louisbhr.github.io"
# Login (Schritt 1b): Worker prüft das Firebase-ID-Token auf /coach, /exchange
# und /refresh. Beide Werte sind öffentlich unkritisch; leer = Worker lehnt
# alles mit not_configured ab (fail closed).
FIREBASE_PROJECT_ID = "trainingsplanung-2c6c0"
ALLOWED_UID = "gH4Te1JZzaO7DVoTSg9TtK4gw8p1"
# Übergang in drei Phasen: "report" prüft und loggt nur, blockiert nie (altes
# Frontend läuft weiter); "required" blockiert. Fehlt der Wert oder ist er
# unbekannt, gilt "required". Nach der Umstellung wird "report" entfernt.
AUTH_MODE = "report"
