# Deploy mit:  npx wrangler deploy
# Danach einmalig die Secrets setzen:
#   npx wrangler secret put STRAVA_CLIENT_ID
#   npx wrangler secret put STRAVA_CLIENT_SECRET
# Optional (empfohlen), begrenzt, wer den Worker nutzen darf:
#   npx wrangler secret put ALLOWED_ORIGINS      # z. B. https://<name>.github.io
name = "hm-tracker-auth"
main = "worker.js"
compatibility_date = "2024-11-01"
